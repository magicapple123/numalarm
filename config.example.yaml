# ============================================================
# 牛马铃（numalarm）配置示例
#
# 用法：复制本文件为 config.yaml（放在运行目录，或用 NUMALARM_CONFIG
#       环境变量指定路径），按需修改；也可通过 `numalarm init` 交互式生成。
# 说明：所有参数均有内置默认值，注释掉的/未列出的项一律使用默认值；
#       改完即时生效（CLI 每次拨打都重新读取；HTTP serve 需重启服务）。
#
# 常用场景速查：
#   · 手机静音怕被连环轰炸     -> retry.max_attempts 设为 5
#   · 人在电脑前不想被拨打     -> presence 默认已处理（键鼠活跃自动跳过）
#   · 等待 CI / 子代理期间免打扰 -> 让 Agent 运行 `numalarm hold -m 60`
#   · 对方接听后播报语音       -> media.speak_on_answer: true（需虚拟声卡）
#   · Agent 硬崩溃也要收到提醒 -> numalarm watchdog install + watchdog 配置
# ============================================================

# ---------------- 拨打目标 ----------------
# 默认拨打目标：QQ 好友的昵称或备注（须与 QQ 搜索框输入完全一致才能搜到）。
# CLI 不传目标、SDK/HTTP 不传 target 时拨打此人。
default_target: 张三

# 别名映射：别名 -> 真实昵称/备注，可配多个。
# 配置后可直接说「打给老板」，Agent 也会把别名转换后再搜索。
# 注意：别名与昵称都走 QQ 搜索框，搜索结果默认点击第一条，
#       确保目标好友昵称在 QQ 里唯一性越高越稳。
target_alias:
  老板: 张三
  工作号: 李四

# ---------------- QQ 相关 ----------------
# QQ 进程名：拨打前检查 QQ 是否在运行用的进程名。
# 任务管理器 -> 详细信息 -> 找到 QQ 的名称；新版 QQ 一般仍为 QQ.exe。
qq_process_name: QQ.exe

# QQ 主面板窗口标题匹配关键字：用于唤起/前置主面板。
# 若你的 QQ 面板标题特殊（如企业定制版），改成实际标题里稳定出现的文字。
qq_window_title: QQ

# 通话窗口检测关键字：点击语音按钮后，用窗口标题是否含此关键字
# 判断「通话窗口已弹出、拨打已触发」。
call_window_hint: 通话

# 是否检测独立通话窗口：
#   true  = 检测（推荐，配合 retry 实现无人接听判定）
#   false = 你的 QQ 版本点击语音按钮后不弹独立窗口时关闭，
#           此时无法判定接听/无人接听，只会拨一次不重拨
verify_call_window: true

# 鼠标移到屏幕左上角触发 pyautogui 保护中断（紧急停止手段）。
# 误触发想彻底禁掉可改 false，但会失去唯一的人工急停手段，不建议。
failsafe: true

# ---------------- 快捷键（必须与 QQ 设置里的快捷键一致） ----------------
hotkey:
  # 唤起 QQ 主面板的全局快捷键。
  # 到 QQ 设置 -> 热键 里找到「提取消息/主面板」，改成与这里相同的值。
  # 改这里不改 QQ、或改 QQ 不改这里，都会导致唤不起面板。
  wake_panel: ctrl+alt+z

  # 打开主面板内搜索框的快捷键（仅 search_method: hotkey 时使用）。
  search: ctrl+f

# ---------------- 搜索方式（QQ NT 新版重点校准区） ----------------
# 搜索框打开方式：
#   click  = 按下方偏移坐标直接点击主面板搜索框（推荐，QQ NT 不响应 Ctrl+F）
#   hotkey = 发送 hotkey.search 快捷键（旧版 QQ 可用）
search_method: click

# click 模式：搜索框点击点相对「主面板左上角」的像素偏移 [x, y]。
# 分辨率/DPI/QQ 窗口尺寸变化后必须重新校准：
#   用 numalarm test <目标> 观察点击位置偏差，微调这两个数字。
search_box_offset: [225, 81]

# 搜索结果选中方式：
#   click  = 点击第一条搜索结果（推荐，部分 QQ 版本回车不选中）
#   enter  = 回车选中第一条
search_select: click

# click 选中模式：第一条搜索结果点击点相对主面板左上角的像素偏移 [x, y]。
# 同样随分辨率/DPI 变化，用 numalarm test 校准。
search_result_offset: [178, 184]

# ---------------- 时序参数（单位：秒） ----------------
# 各步骤之间的等待时长。机器较慢、QQ 加载慢时整体调大；
# 追求速度时可在 test 校准通过的前提下小幅调小。
timing:
  key_interval: 0.05           # 模拟键盘输入每个字符的间隔
  action_wait: 0.6             # 每步 UI 操作后的基础等待
  search_wait: 2.0             # 在搜索框输入关键词后，等搜索结果出现的时间
  chat_open_wait: 1.5          # 选中好友后，等聊天窗口/会话打开的时间
  click_confirm_wait: 2.0      # 点击「语音通话」按钮后，等拨打触发的确认时间
  verify_window_timeout: 8.0   # 等待通话窗口出现的检测超时（超时判 1004）

# ---------------- 图片匹配（定位「语音通话」按钮） ----------------
# 模板来自 assets/voice_button_sample.png，必须与运行时分辨率/DPI 一致。
match:
  # 匹配置信度 0-1：越高越严格。
  # 出现点错人/点错按钮 -> 调高（如 0.85）；总提示 1003 匹配失败 -> 调低（如 0.75）。
  confidence: 0.8

  # 单次拨打内匹配失败后的自动重试次数（每次重试会重新截图匹配）。
  max_retry: 2

  # 灰度匹配：忽略颜色差异，抗 QQ 主题换肤干扰，且更快。推荐保持 true。
  grayscale: true

# ---------------- 防抖（防止电话轰炸） ----------------
debounce:
  # 开关。开启后：同一目标在窗口期内被多次触发（如 Agent 反复停止）
  # 只拨一次，其余调用直接返回 429，避免连环轰炸。
  enabled: true

  # 防抖窗口时长（秒）。默认 5 分钟；
  # 窗口从「该目标上一次真实拨打开始」起算，可用 numalarm test 查看记录。
  window_seconds: 300

# ---------------- 无人接听自动重拨 ----------------
# 核心判定逻辑：拨打后监控通话窗口顶部的「等待对方接听」文案——
#   文案变化（计时器/拒绝提示）= 已接听或已拒绝，立即停止；
#   窗口关闭且全程在响铃 = 无人接听，按下述配置自动重拨。
retry:
  # 重拨总开关（需 verify_call_window: true 才能判定结果）。
  enabled: true

  # ★ 总拨打次数上限（含首次）。手机静音/怕被连环轰炸时务必设置！
  #   0 = 不限次，直至对方接听或拒绝（强提醒语义）
  #   5 = 最多拨 5 次，全部无应答则停止并返回 1004
  max_attempts: 0

  # 相邻两次拨打的间隔（秒）。
  interval_seconds: 10

  # 单轮响铃时长上限（秒）：响铃超过该值视为无人接听，
  # 主动点击挂断并进入下一轮，避免干等 QQ 自然超时（可达数分钟）。
  # 设 0 = 不主动挂断，等 QQ 自然结束。
  ring_seconds: 45

  # 自然响铃超时下限（秒）：通话窗口存活短于该值就关闭，
  # 说明不是「响到自然超时」，而是对方秒接/秒拒 = 触达成功。
  # 防止「秒拒」被误判成无人接听而不停重拨。一般无需调整。
  natural_ringout_seconds: 120

  # 兜底判定阈值（秒）：仅当 assets/call_ringing_sample.png 响铃模板缺失时启用，
  # 按通话窗口从出现到关闭的历经时长粗判（超阈值=无应答）。
  # 有响铃模板时走精确的文案判定，此值不参与。
  no_answer_seconds: 25

# ---------------- 用户在位检测（人在电脑前不打扰） ----------------
# 仅对「自动化触发」生效：hook（Stop/Notification/PermissionRequest）、
# 看门狗、SDK/HTTP 默认的 auto=True 调用。
# 你亲手敲的 numalarm call（不带 --auto）永远照打，不受此检测限制。
presence:
  # 空闲检测开关。
  enabled: true

  # 键鼠空闲判定阈值（秒）：
  #   空闲 >= 该值 = 你已离开电脑 -> 真实响铃
  #   空闲 <  该值 = 你正在电脑前 -> 静默跳过（不打扰）
  # 离开后自动恢复拨打；重拨会话进行中你回到电脑前，下一轮自动停止。
  # 觉得太灵敏（离开一会儿就打）可调大到 300；
  # 觉得离开很久了还检测不到操作可调小。
  idle_seconds: 180

# ---------------- 接听后语音提醒（可选，需虚拟声卡） ----------------
# 对方接听电话后，自动向其播报一段固定语音（如「任务有新进展，请前往电脑查看」）。
# 原理：Windows SAPI 离线合成语音 -> 虚拟声卡 -> QQ 麦克风 -> 对方听到。
# 未安装虚拟声卡时自动降级为普通拨打（不打扰、不报错）。
media:
  # 总开关。启用前提：已安装 VB-Cable 虚拟声卡，且系统默认录音设备为 CABLE Output
  # （详细步骤见 README「接听后语音提醒」）。
  speak_on_answer: false

  # 要播报的文本。SAPI 离线合成，支持中文，无需联网。
  message: 任务有新进展，请前往电脑查看

  # 语音输出设备名关键字：在系统音频输出设备里按名称模糊匹配。
  # VB-Cable 的播放端通常叫「扬声器 (VB-Audio Virtual Cable)」或 CABLE Input，
  # 关键字 CABLE 即可命中；换了其他虚拟声卡产品就改成它的设备名关键字。
  output_device_hint: CABLE

  # 播报完成后是否自动挂断电话：
  #   true  = 播完即挂（纯提醒语义，推荐）
  #   false = 保持通话（对方想回话可以说话——但他听不到你，除非你真人接麦）
  hangup_after_speak: true

  # 播报音量 0-100（写入虚拟声卡的音量，不影响系统音量）。
  volume: 100

  # 单次播报超时（秒），防止合成卡死阻塞拨打流程。
  speak_timeout: 30

# ---------------- 看门狗（Agent 硬崩溃兜底，可选） ----------------
# Agent 进程硬崩溃（强杀/无响应被杀/OOM）时，Stop 等 hook 全部失效——
# 看门狗用计划任务每分钟检查「任务心跳」：心跳停更且 QQ 在运行 = Agent 异常，自动拨打。
# 启用步骤：numalarm watchdog install（注册计划任务 + PreToolUse 心跳 hook）。
watchdog:
  # 看门狗开关（关闭后计划任务即使存在也不动作）。
  enabled: true

  # 心跳超时阈值（秒）：心跳文件超过该时长未刷新即判定 Agent 异常。
  # 必须大于 Agent「纯思考不调工具」的最长间隙（默认 300 秒较稳妥）；
  # 误报（人不在时多打一通）可调大，漏报风险想再降低可调小。
  stale_seconds: 300

# ---------------- 提醒暂停（hold） ----------------
# 「等待 CI / 子代理汇报 / 定时恢复」等自动继续回合的免打扰机制。
# 这不是配置项，而是命令：
#   numalarm hold -m 60    # 暂停 Stop/看门狗拨打 60 分钟（Agent 自动继续回合用）
#   numalarm hold --clear  # 立即恢复（需要用户操作/最终交付时）
# 到期自动恢复，忘记摘牌也不会永久漏提醒。详见 README「暂停提醒」。

# ---------------- 日志 ----------------
log:
  # 日志级别：DEBUG（排查问题）/ INFO（默认）/ WARNING / ERROR。
  level: INFO

  # 日志文件路径（相对运行目录或绝对路径）；置空（null）则不写文件。
  # 排查「为什么没打电话」先看这里：每次触发/跳过/拨打都有记录。
  file: logs/numalarm.log

# ---------------- HTTP 服务 ----------------
server:
  # 监听地址：127.0.0.1 仅本机可调（默认，安全）；
  # 需要局域网内其他设备/远端 Agent 调用时改 0.0.0.0（注意暴露风险）。
  host: 127.0.0.1

  # 监听端口：与 Agent 侧配置的调用地址端口保持一致。
  port: 18600
